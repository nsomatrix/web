<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NinjaBase Login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon/android-chrome-512x512.png">
    <link href="css/bootstrap.css" rel="stylesheet" media="screen">
    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/aes.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/lib-typedarrays.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/pbkdf2.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-analytics.js";
        
        const firebaseConfig = {
            apiKey: 'AIzaSyDp8p_wgeKO_WJAyewYiZhc3en7kF6RXs0',
            authDomain: 'nsomatrix-web.firebaseapp.com',
            projectId: 'nsomatrix-web',
            storageBucket: 'nsomatrix-web.firebasestorage.app',
            messagingSenderId: '320519296982',
            appId: '1:320519296982:web:1ab1b009aeaf7755b13677',
            measurementId: 'G-GK3J5PZW85'
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);
        
        // Make Firebase available globally
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseAnalytics = analytics;
        window.firebaseConfig = firebaseConfig;
        
        // Signal that Firebase is ready
        window.firebaseReady = true;
        document.dispatchEvent(new Event('firebaseReady'));
    </script>

    <script src="js/sound.js"></script>
    <script src="js/essentials.js"></script>
    
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <link rel="stylesheet" href="components/navbar.css">
    <link rel="stylesheet" href="components/footer.css">
    <link rel="stylesheet" href="components/loader.css">
</head>
<body>
    <!-- Global Loader -->
    <div id="loader-container"></div>
    
    <!-- Navbar Component -->
    <div id="navbar-container"></div>

    <iframe id="fullScreenPenEffect" src="pen_effect.html" frameborder="0" scrolling="no"></iframe>

    <div id="main-content">
        <div class="login">
            <h2 id="formTitle">Login</h2>
            <div class="inputBx">
                <input type="email" id="email" placeholder="Email">
            </div>
            <div class="inputBx password-input-container">
                <input type="password" id="password" placeholder="Password">
                <span class="toggle-password" id="togglePassword">
                    <i class="fa fa-eye"></i>
                </span>
            </div>
            <div class="inputBx password-input-container" id="confirmPasswordContainer" style="display: none;">
                <input type="password" id="confirmPassword" placeholder="Confirm Password">
                <span class="toggle-password" id="toggleConfirmPassword">
                    <i class="fa fa-eye"></i>
                </span>
            </div>
            <!-- Cloudflare Turnstile -->
            <div class="inputBx" style="display: flex; justify-content: center; margin: 20px 0;">
                <div id="turnstile-container" style="min-height: 65px; display: flex; align-items: center; justify-content: center;">
                    <div style="color: #666; font-size: 14px;">Loading security verification...</div>
                </div>
            </div>
            <div class="inputBx">
                <button id="primaryBtn" type="submit" disabled>Sign in</button>
            </div>
            <div class="inputBx">
                <button id="switchBtn" type="button">Sign Up</button>
            </div>
            <center>
            <div class="links" id="forgotPasswordLink">
                <a href="#">Forgot Password?</a>
            </div>
            </center>
        </div>
    </div>



    <script src="js/bootstrap.min.js"></script>
    <script type="module" src="js/login.js"></script>
    <script src="components/loader.js"></script>
    <script>
        // Load loader first
        fetch('components/loader.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('loader-container').innerHTML = html;
            });
        
        const script = document.createElement('script');
        script.src = 'components/navbar.js';
        script.onload = () => {
            fetch('components/navbar.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('navbar-container').innerHTML = html;
                    const initNavbar = () => {
                        if (window.firebaseReady) {
                            new RetroNavbar();
                            new NavbarAuth();
                        } else {
                            setTimeout(initNavbar, 100);
                        }
                    };
                    initNavbar();
                });
        };
        document.head.appendChild(script);
        
        fetch('components/footer.html')
            .then(response => response.text())
            .then(html => {
                document.body.insertAdjacentHTML('beforeend', html);
            });
    </script>

</body>
</html>
