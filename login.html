<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSO Matrix Login</title>
    <script src="js/error-suppression.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    <link href="css/bootstrap.css" rel="stylesheet" media="screen">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="components/navbar.css">
    <link rel="stylesheet" href="components/footer.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/aes.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/lib-typedarrays.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/pbkdf2.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-analytics.js";
        
        const firebaseConfig = await window.firebaseConfigLoader.loadConfig();
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);
        
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseAnalytics = analytics;
        window.firebaseConfig = firebaseConfig;
        window.firebaseReady = true;
        document.dispatchEvent(new Event('firebaseReady'));
    </script>
    <script src="js/sound.js"></script>
    <script src="js/essentials.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <header id="navbar"></header>
    <iframe id="fullScreenPenEffect" src="pen_effect.html" frameborder="0" scrolling="no"></iframe>

    <div id="main-content">
        <div class="login">
            <h2 id="formTitle">Login</h2>
            <div class="inputBx">
                <input type="email" id="email" placeholder="Email">
            </div>
            <div class="inputBx password-input-container">
                <input type="password" id="password" placeholder="Password">
                <span class="toggle-password" id="togglePassword">
                    <i class="fa fa-eye"></i>
                </span>
            </div>
            <div class="inputBx password-input-container" id="confirmPasswordContainer" style="display: none;">
                <input type="password" id="confirmPassword" placeholder="Confirm Password">
                <span class="toggle-password" id="toggleConfirmPassword">
                    <i class="fa fa-eye"></i>
                </span>
            </div>
            <div class="inputBx" style="display: flex; justify-content: center; margin: 20px 0;">
                <div id="turnstile-container" style="min-height: 65px; display: flex; align-items: center; justify-content: center;">
                    <div style="color: #666; font-size: 14px;">Loading security verification...</div>
                </div>
            </div>
            <div class="inputBx">
                <button id="primaryBtn" type="submit" disabled>Sign in</button>
            </div>
            <div class="inputBx">
                <button id="switchBtn" type="button">Sign Up</button>
            </div>
            <center>
                <div class="links" id="forgotPasswordLink">
                    <a href="#">Forgot Password?</a>
                </div>
            </center>
        </div>
    </div>

    <footer id="footer"></footer>

    <script src="js/bootstrap.min.js"></script>
    <script type="module" src="js/login.js"></script>
    <script src="components/loader.js"></script>
    <script src="js/component-loader.js"></script>
</body>
</html>
