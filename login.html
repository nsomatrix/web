<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NinjaBase Login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon/android-chrome-512x512.png">
    <link href="css/bootstrap.css" rel="stylesheet" media="screen">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/aes.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/lib-typedarrays.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/pbkdf2.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-analytics.js";
        
        const firebaseConfig = {
            apiKey: 'AIzaSyDp8p_wgeKO_WJAyewYiZhc3en7kF6RXs0',
            authDomain: 'nsomatrix-web.firebaseapp.com',
            projectId: 'nsomatrix-web',
            storageBucket: 'nsomatrix-web.firebasestorage.app',
            messagingSenderId: '320519296982',
            appId: '1:320519296982:web:1ab1b009aeaf7755b13677',
            measurementId: 'G-GK3J5PZW85'
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);
        
        // Make Firebase available globally
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseAnalytics = analytics;
        window.firebaseConfig = firebaseConfig;
        
        // Signal that Firebase is ready
        window.firebaseReady = true;
        document.dispatchEvent(new Event('firebaseReady'));
    </script>

    <script src="js/sound.js"></script>
    <script src="js/essentials.js"></script>

    <link rel="stylesheet" href="css/footer.css">
    <style>
        #navbar-placeholder {
            opacity: 0;
            transition: opacity 0.3s ease;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <iframe id="fullScreenPenEffect" src="pen_effect.html" frameborder="0" scrolling="no"></iframe>

    <div id="navbar-placeholder"></div>

    <div id="main-content">
        <div class="login">
            <h2>Login</h2>
            <div class="inputBx">
                <input type="email" id="email" placeholder="Email">
            </div>
            <div class="inputBx password-input-container">
                <input type="password" id="password" placeholder="Password">
                <span class="toggle-password" id="togglePassword">
                    <i class="fa fa-eye"></i>
                </span>
            </div>
            <div class="inputBx">
                <button id="loginBtn" type="submit">Sign in</button>
            </div>
            <div class="inputBx">
                <button id="signupBtn" type="button">Sign Up</button>
            </div>
            <center>
            <div class="links">
                <a href="#">Forgot Password?</a>
            </div>
            </center>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/bootstrap.min.js"></script>
    <script type="module" src="js/login.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
