<!DOCTYPE html>
<html lang="en">
<head>
  <title>NinjaBase - MODs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="css/bootstrap.css" rel="stylesheet">
  <link href="css/mods.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/essentials.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon/android-chrome-512x512.png">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>


  <div class="container">
    <div class="text-center header-section">
      <h1 class="page-title">MODs Repository</h1>
      <p class="page-subtitle">Working MODs are published here. Obsolete MODs will be moved to <a href="https://cloudkore.github.io/matrix/library.html" class="archive-link">Archives</a></p>
    </div>

    <div class="search-section">
      <input type="text" id="searchInput" class="search-input" placeholder="Search MODs...">
    </div>

    <div id="fileList" class="mods-grid loading">
      <div class="loading-message">Loading MODs... 
        <svg class="loader" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="31.416" stroke-dashoffset="31.416">
            <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/bootstrap.min.js"></script>
  <script src="js/mods-handler.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
