<!DOCTYPE html>
<html lang="en">
<head>
    <title>Global Time Tracker - Matrix-WEB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="css/bootstrap.css" rel="stylesheet" media="screen">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/timezone.css">
    <link rel="stylesheet" href="components/navbar.css">
    <link rel="stylesheet" href="components/footer.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: 'AIzaSyDp8p_wgeKO_WJAyewYiZhc3en7kF6RXs0',
            authDomain: 'nsomatrix-web.firebaseapp.com',
            projectId: 'nsomatrix-web',
            storageBucket: 'nsomatrix-web.firebasestorage.app',
            messagingSenderId: '320519296982',
            appId: '1:320519296982:web:1ab1b009aeaf7755b13677',
            measurementId: 'G-GK3J5PZW85'
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        window.firebaseAuth = firebase.auth();
        window.firebaseDb = firebase.firestore();
    </script>
    <script src="js/essentials.js"></script>
</head>
<body>
    <!-- Navbar Component -->
    <div id="navbar-container"></div>

    <div class="container">
        <div class="header-section">
            <h1 class="page-title">Global Time Tracker</h1>
            <p class="page-subtitle">Track time zones across all countries worldwide</p>
        </div>
        
        <div class="utc-display">
            <div class="label">NSO Server Time</div>
            <div class="time" id="utc-time"></div>
            <div class="date" id="utc-date"></div>
        </div>

        <div class="search-container">
            <input type="text" id="country-search" placeholder="Search for a country" class="search-input">
            <div id="search-results" class="search-results"></div>
        </div>

        <div class="comparison-section">
            <h2 class="comparison-title">Compare Times</h2>
            <div class="comparison-selectors">
                <div class="custom-select" id="country1-dropdown">
                    <div class="select-display">Select first country</div>
                    <div class="select-options" id="country1-options">
                        <input type="text" class="dropdown-search" id="country1-search" placeholder="Search countries...">
                        <div class="options-list" id="country1-list"></div>
                    </div>
                </div>
                <span class="vs-text">VS</span>
                <div class="custom-select" id="country2-dropdown">
                    <div class="select-display">Select second country</div>
                    <div class="select-options" id="country2-options">
                        <input type="text" class="dropdown-search" id="country2-search" placeholder="Search countries...">
                        <div class="options-list" id="country2-list"></div>
                    </div>
                </div>
            </div>
            <div id="comparison-results" class="comparison-results"></div>
        </div>
    </div>

    <!-- Footer Component -->
    <div id="footer-container"></div>

    <script src="components/navbar.js"></script>
    <script src="js/timezone.js"></script>
    <script>
        // Load navbar component
        fetch('components/navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-container').innerHTML = html;
                new RetroNavbar();
                new NavbarAuth();
            });
        
        // Load footer component
        fetch('components/footer.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('footer-container').innerHTML = html;
            });
    </script>
</body>
</html>
