<!DOCTYPE html>
<html lang="en">
<head>
    <title>Global Time Tracker - Matrix-WEB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="css/bootstrap.css" rel="stylesheet" media="screen">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/timezone.css">
    <link rel="stylesheet" href="components/navbar.css">
    <link rel="stylesheet" href="components/footer.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
        window.firebaseConfigLoader.loadConfig().then(firebaseConfig => {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            window.firebaseAuth = firebase.auth();
            window.firebaseDb = firebase.firestore();
        });
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        window.firebaseAuth = firebase.auth();
        window.firebaseDb = firebase.firestore();
    </script>
    <script src="js/essentials.js"></script>
</head>
<body>
    <!-- Navbar Component -->
    <div id="navbar-container"></div>

    <div class="container">
        <div class="header-section">
            <h1 class="page-title">Global Time Tracker</h1>
            <p class="page-subtitle">Track time zones across all countries worldwide</p>
        </div>
        
        <div class="utc-display">
            <div class="label">NSO Server Time</div>
            <div class="time" id="utc-time"></div>
            <div class="date" id="utc-date"></div>
        </div>

        <div class="search-container">
            <input type="text" id="country-search" placeholder="Search for a country" class="search-input">
            <div id="search-results" class="search-results"></div>
        </div>

        <div class="feature-tabs">
            <button class="tab-btn active" data-tab="world-clock">World Clock</button>
            <button class="tab-btn" data-tab="converter">Time Converter</button>
            <button class="tab-btn" data-tab="meeting-planner">Meeting Planner</button>
            <button class="tab-btn" data-tab="comparison">Compare Times</button>
        </div>

        <div class="tab-content active" id="world-clock">
            <div class="world-clock-controls">
                <button id="add-timezone-btn" class="action-btn">+ Add Timezone</button>
                <button id="clear-all-btn" class="action-btn secondary">Clear All</button>
            </div>
            <div id="world-clock-grid" class="world-clock-grid"></div>
        </div>

        <div class="tab-content" id="converter">
            <div class="converter-section">
                <h3>Time Zone Converter</h3>
                <div class="converter-inputs">
                    <div class="input-group">
                        <label>From:</label>
                        <div class="custom-select" id="from-timezone">
                            <div class="select-display">Select timezone</div>
                            <div class="select-options" id="from-options">
                                <input type="text" class="dropdown-search" placeholder="Search...">
                                <div class="options-list" id="from-list"></div>
                            </div>
                        </div>
                        <input type="datetime-local" id="source-time" class="time-input">
                    </div>
                    <div class="input-group">
                        <label>To:</label>
                        <div class="custom-select" id="to-timezone">
                            <div class="select-display">Select timezone</div>
                            <div class="select-options" id="to-options">
                                <input type="text" class="dropdown-search" placeholder="Search...">
                                <div class="options-list" id="to-list"></div>
                            </div>
                        </div>
                        <div id="converted-time" class="converted-result">Select timezones and time</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="meeting-planner">
            <div class="meeting-planner-section">
                <h3>Meeting Time Planner</h3>
                <div class="planner-controls">
                    <div class="input-group">
                        <label>Meeting Date:</label>
                        <input type="date" id="meeting-date" class="date-input">
                    </div>
                    <div class="input-group">
                        <label>Duration (hours):</label>
                        <input type="number" id="meeting-duration" min="0.5" max="12" step="0.5" value="1" class="duration-input">
                    </div>
                </div>
                <div class="timezone-selector">
                    <h4>Add Participants' Timezones:</h4>
                    <div class="custom-select" id="participant-timezone">
                        <div class="select-display">Select timezone</div>
                        <div class="select-options" id="participant-options">
                            <input type="text" class="dropdown-search" placeholder="Search...">
                            <div class="options-list" id="participant-list"></div>
                        </div>
                    </div>
                    <button id="add-participant-btn" class="action-btn">Add Participant</button>
                </div>
                <div id="participants-list" class="participants-list"></div>
                <div id="meeting-suggestions" class="meeting-suggestions"></div>
            </div>
        </div>

        <div class="tab-content" id="comparison">
            <div class="comparison-section">
                <h3>Compare Times</h3>
                <div class="comparison-selectors">
                    <div class="custom-select" id="country1-dropdown">
                        <div class="select-display">Select first country</div>
                        <div class="select-options" id="country1-options">
                            <input type="text" class="dropdown-search" id="country1-search" placeholder="Search countries...">
                            <div class="options-list" id="country1-list"></div>
                        </div>
                    </div>
                    <span class="vs-text">VS</span>
                    <div class="custom-select" id="country2-dropdown">
                        <div class="select-display">Select second country</div>
                        <div class="select-options" id="country2-options">
                            <input type="text" class="dropdown-search" id="country2-search" placeholder="Search countries...">
                            <div class="options-list" id="country2-list"></div>
                        </div>
                    </div>
                </div>
                <div id="comparison-results" class="comparison-results"></div>
            </div>
        </div>
    </div>

    <!-- Footer Component -->
    <div id="footer-container"></div>

    <script src="components/navbar.js"></script>
    <script src="js/timezone.js"></script>
    <script>
        // Load navbar component
        fetch('components/navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-container').innerHTML = html;
                new RetroNavbar();
                new NavbarAuth();
            });
        
        // Load footer component
        fetch('components/footer.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('footer-container').innerHTML = html;
            });
    </script>
</body>
</html>
