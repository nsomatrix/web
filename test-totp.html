<!DOCTYPE html>
<html lang="en">
<head>
    <title>TOTP Test</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 600px; margin: 0 auto; }
        .test-section { background: #2d2d2d; padding: 20px; margin: 20px 0; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px; border-radius: 4px; border: 1px solid #555; }
        input { background: #3d3d3d; color: white; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #28a745; }
        .error { background: #dc3545; }
        .info { background: #17a2b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TOTP Authenticator Test</h1>
        
        <div class="test-section">
            <h3>1. Generate Secret</h3>
            <button onclick="generateSecret()">Generate New Secret</button>
            <div id="secretResult"></div>
        </div>
        
        <div class="test-section">
            <h3>2. Generate QR Code</h3>
            <input type="email" id="emailInput" placeholder="Enter email" value="test@example.com">
            <button onclick="generateQR()">Generate QR Code</button>
            <div id="qrResult"></div>
        </div>
        
        <div class="test-section">
            <h3>3. Test TOTP Generation</h3>
            <button onclick="generateCurrentTOTP()">Generate Current TOTP</button>
            <div id="totpResult"></div>
        </div>
        
        <div class="test-section">
            <h3>4. Verify TOTP</h3>
            <input type="text" id="codeInput" placeholder="Enter 6-digit code" maxlength="6">
            <button onclick="verifyCode()">Verify Code</button>
            <div id="verifyResult"></div>
        </div>
    </div>

    <script>
        let currentSecret = '';
        
        function generateSecret() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            let secret = '';
            for (let i = 0; i < 32; i++) {
                secret += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentSecret = secret;
            document.getElementById('secretResult').innerHTML = `
                <div class="result success">
                    <strong>Secret:</strong> ${secret}<br>
                    <small>Save this secret for testing</small>
                </div>
            `;
        }
        
        function generateQR() {
            if (!currentSecret) {
                document.getElementById('qrResult').innerHTML = '<div class="result error">Please generate a secret first</div>';
                return;
            }
            
            const email = document.getElementById('emailInput').value || 'test@example.com';
            const issuer = 'NSO Matrix';
            const otpauth = `otpauth://totp/${encodeURIComponent(issuer)}:${encodeURIComponent(email)}?secret=${currentSecret}&issuer=${encodeURIComponent(issuer)}`;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(otpauth)}`;
            
            document.getElementById('qrResult').innerHTML = `
                <div class="result info">
                    <img src="${qrUrl}" alt="QR Code" style="border: 1px solid #555;"><br>
                    <small>Scan this with your authenticator app</small><br>
                    <strong>Manual entry:</strong> ${currentSecret}
                </div>
            `;
        }
        
        async function generateCurrentTOTP() {
            if (!currentSecret) {
                document.getElementById('totpResult').innerHTML = '<div class="result error">Please generate a secret first</div>';
                return;
            }
            
            try {
                const timeWindow = Math.floor(Date.now() / 1000 / 30);
                const code = await generateTOTP(currentSecret, timeWindow);
                const timeLeft = 30 - (Math.floor(Date.now() / 1000) % 30);
                
                document.getElementById('totpResult').innerHTML = `
                    <div class="result success">
                        <strong>Current TOTP:</strong> ${code}<br>
                        <small>Valid for ${timeLeft} more seconds</small>
                    </div>
                `;
            } catch (error) {
                document.getElementById('totpResult').innerHTML = `<div class="result error">Error: ${error.message}</div>`;
            }
        }
        
        async function verifyCode() {
            const code = document.getElementById('codeInput').value.trim();
            if (!currentSecret) {
                document.getElementById('verifyResult').innerHTML = '<div class="result error">Please generate a secret first</div>';
                return;
            }
            
            if (!/^\d{6}$/.test(code)) {
                document.getElementById('verifyResult').innerHTML = '<div class="result error">Please enter a valid 6-digit code</div>';
                return;
            }
            
            try {
                const isValid = await verifyTOTP(currentSecret, code);
                document.getElementById('verifyResult').innerHTML = `
                    <div class="result ${isValid ? 'success' : 'error'}">
                        ${isValid ? '✅ Code is valid!' : '❌ Code is invalid'}
                    </div>
                `;
            } catch (error) {
                document.getElementById('verifyResult').innerHTML = `<div class="result error">Error: ${error.message}</div>`;
            }
        }
        
        // TOTP Implementation
        async function generateTOTP(secret, timeWindow) {
            const key = base32ToBytes(secret);
            const time = new ArrayBuffer(8);
            const timeView = new DataView(time);
            timeView.setUint32(4, timeWindow, false);
            
            const cryptoKey = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, time);
            const hmac = new Uint8Array(signature);
            
            const offset = hmac[hmac.length - 1] & 0xf;
            const code = ((hmac[offset] & 0x7f) << 24) | ((hmac[offset + 1] & 0xff) << 16) | ((hmac[offset + 2] & 0xff) << 8) | (hmac[offset + 3] & 0xff);
            
            return (code % 1000000).toString().padStart(6, '0');
        }
        
        async function verifyTOTP(secret, token) {
            const timeWindow = Math.floor(Date.now() / 1000 / 30);
            
            // Check current time window and adjacent windows for clock drift
            for (let i = -2; i <= 2; i++) {
                const expectedToken = await generateTOTP(secret, timeWindow + i);
                if (expectedToken === token) {
                    return true;
                }
            }
            return false;
        }
        
        function base32ToBytes(base32) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            const cleanBase32 = base32.toUpperCase().replace(/[^A-Z2-7]/g, '');
            
            let bits = '';
            for (let char of cleanBase32) {
                const index = alphabet.indexOf(char);
                if (index === -1) continue;
                bits += index.toString(2).padStart(5, '0');
            }
            
            const bytes = [];
            for (let i = 0; i < bits.length; i += 8) {
                const byte = bits.substring(i, i + 8);
                if (byte.length === 8) {
                    bytes.push(parseInt(byte, 2));
                }
            }
            
            return new Uint8Array(bytes);
        }
        
        // Auto-refresh TOTP every second
        setInterval(() => {
            if (currentSecret && document.getElementById('totpResult').innerHTML.includes('Current TOTP:')) {
                generateCurrentTOTP();
            }
        }, 1000);
    </script>
</body>
</html>
