<!DOCTYPE html>
<html lang="en">
<head>
    <title>NinjaBase Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 100%);
            color: white;
            font-family: DOS, Monaco, Menlo, Consolas, "Courier New", monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 2px solid rgba(255, 0, 0, 0.3);
            border-top: 2px solid #ff0000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading Dashboard...</p>
    </div>

    <script>
        // Auto-redirect based on screen size and device type
        function redirectToDashboard() {
            const screenWidth = window.innerWidth;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            // Use desktop layout for screens wider than 1024px and not mobile
            if (screenWidth >= 1024 && !isMobile) {
                window.location.href = 'dashboard-desktop.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        // Redirect after a short delay to show loading
        setTimeout(redirectToDashboard, 1000);
        
        // Also redirect on resize if user changes window size significantly
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const currentWidth = window.innerWidth;
                const currentPath = window.location.pathname;
                
                // Switch to desktop if on mobile layout but screen is now large
                if (currentWidth >= 1024 && currentPath.includes('dashboard.html')) {
                    window.location.href = 'dashboard-desktop.html';
                }
                // Switch to mobile if on desktop layout but screen is now small
                else if (currentWidth < 1024 && currentPath.includes('dashboard-desktop.html')) {
                    window.location.href = 'dashboard.html';
                }
            }, 500);
        });
    </script>
</body>
</html>
