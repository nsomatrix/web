name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace environment variables
        run: |
          # Create template version of env-loader.js
          cat > js/env-loader.js << 'EOF'
          // Environment variable loader for GitHub Pages
          // This will be replaced by build script with actual values
          window.ENV = {
              FIREBASE_API_KEY: '{{FIREBASE_API_KEY}}',
              FIREBASE_AUTH_DOMAIN: '{{FIREBASE_AUTH_DOMAIN}}',
              FIREBASE_PROJECT_ID: '{{FIREBASE_PROJECT_ID}}',
              FIREBASE_STORAGE_BUCKET: '{{FIREBASE_STORAGE_BUCKET}}',
              FIREBASE_MESSAGING_SENDER_ID: '{{FIREBASE_MESSAGING_SENDER_ID}}',
              FIREBASE_APP_ID: '{{FIREBASE_APP_ID}}',
              FIREBASE_MEASUREMENT_ID: '{{FIREBASE_MEASUREMENT_ID}}',
              SUPABASE_URL: '{{SUPABASE_URL}}',
              SUPABASE_ANON_KEY: '{{SUPABASE_ANON_KEY}}'
          };
          EOF
          
          # Replace placeholders with actual secrets
          sed -i "s/{{FIREBASE_API_KEY}}/${{ secrets.FIREBASE_API_KEY }}/g" js/env-loader.js
          sed -i "s/{{FIREBASE_AUTH_DOMAIN}}/${{ secrets.FIREBASE_AUTH_DOMAIN }}/g" js/env-loader.js
          sed -i "s/{{FIREBASE_PROJECT_ID}}/${{ secrets.FIREBASE_PROJECT_ID }}/g" js/env-loader.js
          sed -i "s/{{FIREBASE_STORAGE_BUCKET}}/${{ secrets.FIREBASE_STORAGE_BUCKET }}/g" js/env-loader.js
          sed -i "s/{{FIREBASE_MESSAGING_SENDER_ID}}/${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}/g" js/env-loader.js
          sed -i "s/{{FIREBASE_APP_ID}}/${{ secrets.FIREBASE_APP_ID }}/g" js/env-loader.js
          sed -i "s/{{FIREBASE_MEASUREMENT_ID}}/${{ secrets.FIREBASE_MEASUREMENT_ID }}/g" js/env-loader.js
          sed -i "s/{{SUPABASE_URL}}/${{ secrets.SUPABASE_URL }}/g" js/env-loader.js
          sed -i "s/{{SUPABASE_ANON_KEY}}/${{ secrets.SUPABASE_ANON_KEY }}/g" js/env-loader.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4