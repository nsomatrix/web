<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .logged-in { background-color: #d4edda; color: #155724; }
        .logged-out { background-color: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Authentication Test</h1>
    <div id="status" class="status">Checking authentication status...</div>
    <div id="user-info"></div>
    <button id="loginBtn" onclick="goToLogin()">Go to Login</button>
    <button id="logoutBtn" onclick="logout()" style="display:none;">Logout</button>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: 'AIzaSyDp8p_wgeKO_WJAyewYiZhc3en7kF6RXs0',
            authDomain: 'nsomatrix-web.firebaseapp.com',
            projectId: 'nsomatrix-web',
            storageBucket: 'nsomatrix-web.firebasestorage.app',
            messagingSenderId: '320519296982',
            appId: '1:320519296982:web:1ab1b009aeaf7755b13677',
            measurementId: 'G-GK3J5PZW85'
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // Monitor auth state
        auth.onAuthStateChanged((user) => {
            const statusDiv = document.getElementById('status');
            const userInfoDiv = document.getElementById('user-info');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            
            if (user) {
                statusDiv.textContent = 'User is logged in';
                statusDiv.className = 'status logged-in';
                userInfoDiv.innerHTML = `
                    <h3>User Information:</h3>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>UID:</strong> ${user.uid}</p>
                    <p><strong>Email Verified:</strong> ${user.emailVerified}</p>
                `;
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                localStorage.setItem('userLoggedIn', 'true');
            } else {
                statusDiv.textContent = 'User is not logged in';
                statusDiv.className = 'status logged-out';
                userInfoDiv.innerHTML = '';
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
                localStorage.removeItem('userLoggedIn');
            }
        });
        
        function goToLogin() {
            window.location.href = 'login.html';
        }
        
        async function logout() {
            try {
                await auth.signOut();
                localStorage.removeItem('userLoggedIn');
                sessionStorage.clear();
                alert('Logged out successfully!');
            } catch (error) {
                console.error('Logout error:', error);
                alert('Logout failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
