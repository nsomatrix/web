<!DOCTYPE html>
<html>
<head>
    <title>Shield Debug</title>
</head>
<body>
    <h1>Shield Debug Test</h1>
    <button onclick="testShield()">Test Shield Functions</button>
    <div id="results"></div>

    <script>
        function testShield() {
            const results = document.getElementById('results');
            results.innerHTML = '<h3>Testing Shield Manager...</h3>';
            
            // Test if shieldManager exists
            if (window.shieldManager) {
                results.innerHTML += '<p>✅ ShieldManager exists</p>';
                
                // Test session creation
                if (window.shieldManager.currentSessionId) {
                    results.innerHTML += `<p>✅ Session ID: ${window.shieldManager.currentSessionId}</p>`;
                } else {
                    results.innerHTML += '<p>❌ No session ID found</p>';
                }
                
                // Test if user is logged in
                if (window.shieldManager.authManager && window.shieldManager.authManager.currentUser) {
                    results.innerHTML += '<p>✅ User is logged in</p>';
                } else {
                    results.innerHTML += '<p>❌ User not logged in</p>';
                }
                
            } else {
                results.innerHTML += '<p>❌ ShieldManager not found</p>';
            }
        }
    </script>
</body>
</html>
