<!DOCTYPE html>
<html lang="en">
<head>
    <title>NinjaBase Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.css" rel="stylesheet">
    <link href="css/dashboard-desktop.css" rel="stylesheet">
</head>
<body>
    <div id="main-dashboard">
        <main class="dashboard-main">
            <div id="overview-section">
                <div class="welcome-section" style="text-align: center;">
                    <h2 class="welcome-message">Dashboard</h2>
                </div>

                <div class="dashboard-grid">
                    <div class="dashboard-card" id="serverBtn">
                        <div class="card-header">
                            <div class="card-icon">
                                <i class="fas fa-server"></i>
                            </div>
                            <h3 class="card-title">Server Management</h3>
                        </div>
                        <p class="card-description">Access and manage your server configurations and settings.</p>
                    </div>

                    <div class="dashboard-card" id="notesBtn">
                        <div class="card-header">
                            <div class="card-icon">
                                <i class="fas fa-sticky-note"></i>
                            </div>
                            <h3 class="card-title">Notes</h3>
                        </div>
                        <p class="card-description">Create, edit, and organize your personal notes securely.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
