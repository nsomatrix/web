<!DOCTYPE html>
<html lang="en">
<head>
  <title>NSO Matrix - Commands</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../css/bootstrap.css" rel="stylesheet">
  <link href="../css/pages/commands.css?v=1" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="../js/firebase-config.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
      // Initialize Firebase for navbar auth
      window.firebaseConfigLoader.loadConfig().then(firebaseConfig => {
          if (!firebase.apps.length) {
              firebase.initializeApp(firebaseConfig);
          }
          window.firebaseAuth = firebase.auth();
          window.firebaseDb = firebase.firestore();
      });
  </script>
  <script src="../js/essentials.js"></script>
  <script src="../js/sound.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
    <link rel="manifest" href="../favicon/site.webmanifest">
    <link rel="icon" href="../favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="192x192" href="../favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../favicon/android-chrome-512x512.png">

  <link rel="stylesheet" href="../components/navbar.css">
  <link rel="stylesheet" href="../components/footer.css">
</head>
<body>
  <!-- Navbar Component -->
  <header id="navbar"></header>

  <div class="container">
    <div class="text-center header-section">
      <h1 class="page-title">NSO Commands</h1>
      <p class="page-subtitle">Complete list of NSO game commands organized by category. Use these commands to enhance your gameplay experience.</p>
    </div>

    <div class="stats-section" id="statsSection" style="display: none;">
      <div class="stat-item">
        <span class="stat-number" id="totalCommands">0</span>
        <span class="stat-label">Total Commands</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="generalCount">0</span>
        <span class="stat-label">General</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="nsotienCount">0</span>
        <span class="stat-label">NSO Tien</span>
      </div>
      <div class="stat-item">
        <span class="stat-number" id="trungducCount">0</span>
        <span class="stat-label">Trung Duc</span>
      </div>
    </div>

    <div class="platform-filters" id="categoryFilters">
      <button class="filter-tab active" data-category="all">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/>
        </svg>
        All Commands
      </button>
      <button class="filter-tab" data-category="general">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.22,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.22,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/>
        </svg>
        General
      </button>
      <button class="filter-tab" data-category="nsotien">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12,2A2,2 0 0,1 14,4C14,4.74 13.6,5.39 13,5.73V7H14A7,7 0 0,1 21,14H22A1,1 0 0,1 23,15V18A1,1 0 0,1 22,19H21V20A2,2 0 0,1 19,22H5A2,2 0 0,1 3,20V19H2A1,1 0 0,1 1,18V15A1,1 0 0,1 2,14H3A7,7 0 0,1 10,7H11V5.73C10.4,5.39 10,4.74 10,4A2,2 0 0,1 12,2M7.5,13A2.5,2.5 0 0,0 5,15.5A2.5,2.5 0 0,0 7.5,18A2.5,2.5 0 0,0 10,15.5A2.5,2.5 0 0,0 7.5,13M16.5,13A2.5,2.5 0 0,0 14,15.5A2.5,2.5 0 0,0 16.5,18A2.5,2.5 0 0,0 19,15.5A2.5,2.5 0 0,0 16.5,13Z"/>
        </svg>
        NSO Tien
      </button>
      <button class="filter-tab" data-category="trungduc">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12,2L13.09,8.26L22,9L13.09,9.74L12,16L10.91,9.74L2,9L10.91,8.26L12,2M12,21L10.91,14.74L2,14L10.91,13.26L12,7L13.09,13.26L22,14L13.09,14.74L12,21Z"/>
        </svg>
        Trung Duc
      </button>
    </div>

    <div class="search">
      <input type="text" id="searchInput" class="search__input" placeholder="Search commands by name or description">
    </div>

    <div id="commandsList" class="file-table-container">
      <div class="loading-message">
        Loading commands
        <svg class="loader" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="31.416" stroke-dashoffset="31.416">
            <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
            <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
    </div>
  </div>

  <script src="../js/bootstrap.min.js"></script>
  <script src="../js/essentials.js"></script>
  <script src="../js/commands-handler.js?v=1"></script>

  <footer id="footer"></footer>
  <script src="../js/component-loader.js"></script>
</body>
</html>
