<!DOCTYPE html>
<html lang="en">
<head>
    <title>Game Estimator - Matrix-WEB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="../css/bootstrap.css" rel="stylesheet" media="screen">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/estimator.css">
    <link rel="stylesheet" href="../components/navbar.css">
    <link rel="stylesheet" href="../components/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
    <link rel="manifest" href="../favicon/site.webmanifest">
    <link rel="icon" href="../favicon/favicon.ico" type="image/x-icon">


    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script>
        window.firebaseConfigLoader.loadConfig().then(firebaseConfig => {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            window.firebaseAuth = firebase.auth();
            window.firebaseDb = firebase.firestore();
        });
    </script>
</head>
<body>
    <header id="navbar"></header>

    <div class="container">
        <div class="header-section">
            <h1 class="page-title">Game Estimator</h1>
            <p class="page-subtitle">Calculate your Kins and Level progression</p>
        </div>

        <div class="estimator-tabs">
            <button class="tab-btn active" data-tab="kins">Kins Estimator</button>
            <button class="tab-btn" data-tab="levels">Level Estimator</button>
        </div>

        <div id="kins-tab" class="tab-content active">
            <div class="estimator-card">
                <h2>Kins Calculator</h2>
                <div class="input-group">
                    <label for="kinsPerHour">Kins per Hour:</label>
                    <input type="text" id="kinsPerHour" placeholder="">
                </div>
                <div class="input-group">
                    <label for="days">Number of Days:</label>
                    <input type="number" id="days" placeholder="" min="1" max="365">
                </div>
                <div class="button-group">
                    <button id="calculateKins" class="calculate-btn">
                        <span class="btn-text">Calculate Kins</span>
                        <svg class="btn-spinner" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="31.416" stroke-dashoffset="31.416">
                                <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
                                <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
                            </circle>
                        </svg>
                    </button>
                    <button id="resetKins" class="reset-btn">Reset</button>
                </div>
                
                <div id="kinsResults" class="results-section" style="display: none;">
                    <h3>Results</h3>
                    <div class="result-item">
                        <span class="result-label">Total Kins:</span>
                        <span id="totalKins" class="result-value"></span>
                    </div>
                    
                    <div class="breakdown-section">
                        <h4>Accumulation Breakdown</h4>
                        <div class="result-item">
                            <span class="result-label">Per Day:</span>
                            <span id="kinsPerDay" class="result-value"></span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">Per Week:</span>
                            <span id="kinsPerWeek" class="result-value"></span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">Per Month:</span>
                            <span id="kinsPerMonth" class="result-value"></span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">Per Year:</span>
                            <span id="kinsPerYear" class="result-value"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="levels-tab" class="tab-content">
            <div class="estimator-card">
                <h2>Level Calculator</h2>
                <div class="input-group">
                    <label for="currentLevel">Current Level (1-130):</label>
                    <input type="number" id="currentLevel" placeholder="" min="1" max="130">
                </div>
                <div class="input-group">
                    <label for="currentExp">Current Experience (%):</label>
                    <input type="number" id="currentExp" placeholder="" min="-50" max="99.99" step="0.01">
                </div>
                <div class="input-group">
                    <label for="expPerHour">Experience per Hour (%):</label>
                    <input type="number" id="expPerHour" placeholder="" min="0.01" step="0.01">
                </div>
                <div class="button-group">
                    <button id="calculateLevel" class="calculate-btn">
                        <span class="btn-text">Calculate Level</span>
                        <svg class="btn-spinner" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="31.416" stroke-dashoffset="31.416">
                                <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416" repeatCount="indefinite"/>
                                <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416" repeatCount="indefinite"/>
                            </circle>
                        </svg>
                    </button>
                    <button id="resetLevel" class="reset-btn">Reset</button>
                </div>
                
                <div id="levelResults" class="results-section" style="display: none;">
                    <h3>Time to Next Level</h3>
                    <div class="countdown-display">
                        <div id="countdown" class="countdown-timer"></div>
                    </div>
                    <div class="result-item">
                        <span class="result-label">From Level:</span>
                        <span id="fromLevel" class="result-value"></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">To Level:</span>
                        <span id="toLevel" class="result-value"></span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Experience Needed:</span>
                        <span id="expNeeded" class="result-value"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer id="footer"></footer>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/essentials.js"></script>
    <script src="../js/estimator.js"></script>
    <script>
        
    </script>
    <script src="../components/loader.js"></script>
    <script src="../js/component-loader.js"></script>
</body>
</html>
